<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f2e9" />
    <meta name="description" content="Un petit jardin de poche pour suivre ses plantes et leurs soins." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>Mon Jardin — mes plantes</title>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#accueil"><span class="brand-icon">✳</span><span>mon jardin<small>TON COIN DE VERDURE</small></span></a>
        <nav aria-label="Navigation principale">
          <a class="nav-link active" href="#accueil" data-view="accueil">⌂ <span>Vue d’ensemble</span></a>
          <a class="nav-link" href="#plantes" data-view="plantes">❀ <span>Mes plantes</span></a>
          <a class="nav-link" href="#calendrier" data-view="calendrier">▦ <span>Calendrier</span></a>
        </nav>
        <div class="sidebar-bottom"><div class="small-leaf">✳</div><p>Un peu d’attention,<br />beaucoup de verdure.</p><small>Chaque plante à son rythme.</small></div>
      </aside>

      <main id="main">
        <header class="topbar"><span id="breadcrumb">MON ESPACE / VUE D’ENSEMBLE</span><span id="today-label"></span></header>
        <section id="app" aria-live="polite"></section>
      </main>
    </div>

    <dialog id="plant-dialog" aria-labelledby="dialog-title">
      <form id="plant-form" novalidate>
        <div class="dialog-head"><div><span class="eyebrow">UNE NOUVELLE POUSSE</span><h2 id="dialog-title">Ajouter une plante</h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="Fermer">×</button></div>
        <div class="form-grid">
          <label class="field">Petit nom <input name="name" required maxlength="60" placeholder="Ex. : Monstera du salon" /></label>
          <label class="field">Espèce / type <input name="species" maxlength="80" placeholder="Ex. : Monstera deliciosa" /></label>
          <label class="field">Emplacement <input name="location" maxlength="60" placeholder="Ex. : Salon, près de la fenêtre" /></label>
          <label class="field">Lumière <select name="light"><option value="indirecte">Lumière indirecte</option><option value="directe">Soleil direct</option><option value="faible">Lumière faible</option></select></label>
          <label class="field">Arrosage été · tous les <span class="unit"><input name="summer" type="number" min="1" max="365" value="7" required /><span>jours</span></span></label>
          <label class="field">Arrosage hiver · tous les <span class="unit"><input name="winter" type="number" min="1" max="365" value="14" required /><span>jours</span></span></label>
          <label class="field">Nettoyage des feuilles · tous les <span class="unit"><input name="clean" type="number" min="1" max="365" value="30" required /><span>jours</span></span></label>
          <label class="field">Dernier arrosage <input name="lastWatered" type="date" required /></label>
        </div>
        <label class="field photo-field">Photo de la plante <input id="photo-input" type="file" accept="image/*" /><small>Optionnelle. La photo est réduite avant d’être enregistrée sur cet appareil.</small></label>
        <div id="form-error" class="form-error" role="alert"></div>
        <div class="dialog-actions"><button type="button" class="button ghost" id="cancel-dialog">Annuler</button><button class="button primary" type="submit">Enregistrer la plante <span>↗</span></button></div>
      </form>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
