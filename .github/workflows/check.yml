name: Check
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check app.js
          node --check plant-catalog.js
          node --check health-view.js
          node --check functions/api/health.js
          node --check sync-v2.js
          node --check functions/api/ops.js
          node --check functions/api/sync.js
          node --check worker.js
